<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TorqueStock">
  <!-- Logotipo de TorqueStock: carátula de torquímetro con aguja y tuerca hexagonal -->
  <rect width="64" height="64" rx="14" fill="#e2662f"/>
  <!-- Carátula (arco de 270°) -->
  <path d="M18.6 45.4 A19 19 0 1 1 45.4 45.4" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Marcas de la escala -->
  <g stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".85">
    <line x1="32" y1="17.5" x2="32" y2="21"/>
    <line x1="21.7" y1="21.7" x2="24.2" y2="24.2"/>
    <line x1="17.5" y1="32" x2="21" y2="32"/>
    <line x1="46.5" y1="32" x2="43" y2="32"/>
  </g>
  <!-- Aguja -->
  <line x1="32" y1="32" x2="42.5" y2="21.5" stroke="#1f3a5f" stroke-width="4" stroke-linecap="round"/>
  <!-- Tuerca hexagonal -->
  <polygon points="39,32 35.5,38.06 28.5,38.06 25,32 28.5,25.94 35.5,25.94" fill="#1f3a5f"/>
  <circle cx="32" cy="32" r="2.6" fill="#fff"/>
</svg>
