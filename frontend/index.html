<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TorqueStock">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>TorqueStock — Iniciar sesión</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-pagina">
    <form class="login-caja" id="formLogin" novalidate>
      <div class="login-logo">
        <img class="logo" src="img/logo.svg" alt="" width="46" height="46">
        <h1>TorqueStock</h1>
      </div>
      <p class="login-sub">Almacén de Herramientas de Torque · Grupo Industrial Par-Tec</p>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" maxlength="15" autocomplete="username" autofocus>
        <span class="ayuda"><span>Solo letras y números</span><span id="contUsuario">0/15</span></span>
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" maxlength="15" autocomplete="current-password">
        <span class="ayuda"><span>Solo letras y números</span><span id="contClave">0/15</span></span>
      </div>
      <div class="error-form" id="errorLogin"></div>
      <button class="btn btn-naranja btn-bloque" type="submit">Iniciar sesión</button>
      <p class="login-modo" id="loginModo" hidden></p>

      <div class="login-demo">
        <strong>Usuarios de prueba:</strong><br>
        Jefe de almacén: <code>jefe</code> / <code>jefe123</code><br>
        Almacenista: <code>almacen</code> / <code>almacen123</code><br>
        Calidad: <code>calidad</code> / <code>calidad123</code>
      </div>
      <a class="enlace-ayuda" href="ayuda.html">¿Cómo uso TorqueStock?</a>
      <a class="enlace-ayuda" href="acerca.html">Acerca del proyecto</a>
    </form>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
